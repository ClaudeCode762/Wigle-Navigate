name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test & build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WiGLE-Offline-Navigator-${VERSION}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WiGLE-Offline-Navigator-apk
          path: out/*.apk
          if-no-files-found: error

name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK ist auf ubuntu-latest vorinstalliert ($ANDROID_HOME);
      # fehlende Platforms/Build-Tools lädt AGP automatisch.
      - uses: gradle/actions/setup-gradle@v5

      - name: Test & build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/WiGLE-Offline-Navigator-${VERSION}-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: WiGLE-Offline-Navigator-apk
          path: out/*.apk
          if-no-files-found: error
